<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hexsss — Portfolio</title>
  <meta name="description" content="Portfolio of John Hendrix Barcelon (hexsss), Computer Science student.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 46'%3E%3Cpath d='M20 2 38 12.5v21L20 44 2 33.5v-21Z' fill='%2307070a' stroke='%23ff3d4f' stroke-width='3'/%3E%3Cpath d='M20 15 27 19v8l-7 4-7-4v-8Z' fill='%23ff3d4f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Shared SVG gradients / patterns -->
  <svg class="defs" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ff8a5b"/>
        <stop offset="1" stop-color="#ff3d4f"/>
      </linearGradient>
      <radialGradient id="coreFill" cx="50%" cy="42%" r="62%">
        <stop offset="0" stop-color="#ff3d4f" stop-opacity=".34"/>
        <stop offset=".6" stop-color="#ff3d4f" stop-opacity=".08"/>
        <stop offset="1" stop-color="#ff3d4f" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="wordFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".10"/>
        <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
      <pattern id="hexPattern" width="28" height="50" patternUnits="userSpaceOnUse">
        <path d="M14 33 0 25V8L14 0l14 8v17L14 33v17" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
      </pattern>
    </defs>
  </svg>

  <!-- Animated honeycomb background -->
  <canvas id="hexfield" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- ========== NAV ========== -->
  <header class="nav">
    <a href="#home" class="brand" aria-label="hexsss home">
      <svg viewBox="0 0 40 46" aria-hidden="true">
        <path class="h-out" d="M20 2 38 12.5v21L20 44 2 33.5v-21Z"/>
        <path class="h-in" d="M20 15 27 19v8l-7 4-7-4v-8Z"/>
      </svg>
      <span>hex<b>sss</b></span>
    </a>

    <nav class="links" aria-label="Main">
      <a href="#home" class="active">Home</a>
      <a href="#projects">Projects</a>
      <a href="#lectures">Lectures</a>
      <a href="#contact">Contact</a>
    </nav>

    <a href="#contact" class="talk">
      Let's talk
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>
    </a>

    <button class="menu-btn" type="button" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span>
    </button>
  </header>

  <!-- ========== HERO ========== -->
  <main>
    <section class="hero" id="home">

      <!-- Giant outlined username -->
      <svg class="wordmark" data-depth="-14" viewBox="0 0 1200 260" aria-hidden="true">
        <text x="600" y="215" text-anchor="middle" textLength="1150" lengthAdjust="spacingAndGlyphs">HEXSSS</text>
      </svg>

      <!-- Intro -->
      <div class="intro">
        <p class="hi">Hi, I'm</p>
        <h1>John Hendrix <span>Barcelon</span></h1>
        <p class="role">
          <svg viewBox="0 0 40 46" aria-hidden="true"><path d="M20 2 38 12.5v21L20 44 2 33.5v-21Z"/></svg>
          Computer Science Student
        </p>
        <div class="cta">
          <a class="btn primary" href="#projects">
            View my work
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
          <a class="btn icon" href="#contact" aria-label="Contact me">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg>
          </a>
        </div>
      </div>

      <!-- Photo stage -->
      <div class="stage">
        <div class="layer layer-back" data-depth="-10">
          <div class="aura"></div>
          <svg class="rings" viewBox="0 0 600 600" aria-hidden="true">
            <g class="spin-slow">
              <polygon class="ring-outer" points="300,10 551.1,155 551.1,445 300,590 48.9,445 48.9,155"/>
              <circle class="tick" cx="300" cy="10" r="3.5"/>
              <circle class="tick" cx="551.1" cy="155" r="3.5"/>
              <circle class="tick" cx="551.1" cy="445" r="3.5"/>
              <circle class="tick" cx="300" cy="590" r="3.5"/>
              <circle class="tick" cx="48.9" cy="445" r="3.5"/>
              <circle class="tick" cx="48.9" cy="155" r="3.5"/>
            </g>
            <polygon class="ring-mid" points="300,45 520.8,172.5 520.8,427.5 300,555 79.2,427.5 79.2,172.5"/>
            <g class="core">
              <polygon class="core-fill" points="300,85 486.2,192.5 486.2,407.5 300,515 113.8,407.5 113.8,192.5"/>
              <polygon class="core-grid" points="300,85 486.2,192.5 486.2,407.5 300,515 113.8,407.5 113.8,192.5"/>
              <polygon class="core-edge" points="300,85 486.2,192.5 486.2,407.5 300,515 113.8,407.5 113.8,192.5"/>
            </g>
            <circle class="scan" r="4">
              <animateMotion dur="9s" repeatCount="indefinite" path="M300 85 486.2 192.5 486.2 407.5 300 515 113.8 407.5 113.8 192.5Z"/>
            </circle>
            <circle class="scan" r="3">
              <animateMotion dur="9s" begin="-4.5s" repeatCount="indefinite" path="M300 85 486.2 192.5 486.2 407.5 300 515 113.8 407.5 113.8 192.5Z"/>
            </circle>
          </svg>
        </div>

        <div class="layer" data-depth="12">
          <img class="portrait" src="barcelon.png" alt="John Hendrix Barcelon" width="1000" height="1000">
        </div>

        <!-- Floating badges -->
        <div class="float f-handle" data-depth="26">
          <span class="chip"><i></i>@hexsss</span>
        </div>

        <div class="float f-code" data-depth="34" title="Code">
          <svg class="badge" style="--d:.9s" viewBox="0 0 64 74" aria-hidden="true">
            <polygon class="bg" points="32,1 63,19 63,55 32,73 1,55 1,19"/>
            <g class="ic" transform="translate(20 25)"><path d="m8 6-6 6 6 6M16 6l6 6-6 6M13.5 4l-3 16"/></g>
          </svg>
        </div>

        <div class="float f-term" data-depth="22" title="Terminal">
          <svg class="badge" style="--d:1.05s" viewBox="0 0 64 74" aria-hidden="true">
            <polygon class="bg" points="32,1 63,19 63,55 32,73 1,55 1,19"/>
            <g class="ic" transform="translate(20 25)"><rect x="2.5" y="4" width="19" height="16" rx="2.5"/><path d="m7 9.5 3 2.5-3 2.5M12.5 15H17"/></g>
          </svg>
        </div>

        <div class="float f-chip" data-depth="40" title="Hardware">
          <svg class="badge" style="--d:1.2s" viewBox="0 0 64 74" aria-hidden="true">
            <polygon class="bg" points="32,1 63,19 63,55 32,73 1,55 1,19"/>
            <g class="ic" transform="translate(20 25)"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/><path d="M9.5 2.5v4M14.5 2.5v4M9.5 17.5v4M14.5 17.5v4M2.5 9.5h4M2.5 14.5h4M17.5 9.5h4M17.5 14.5h4"/></g>
          </svg>
        </div>

        <div class="float f-git" data-depth="30" title="Version control">
          <svg class="badge" style="--d:1.35s" viewBox="0 0 64 74" aria-hidden="true">
            <polygon class="bg" points="32,1 63,19 63,55 32,73 1,55 1,19"/>
            <g class="ic" transform="translate(20 25)"><circle cx="6" cy="5" r="2.5"/><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 7.5v9M18 10.5c0 4.5-6 4-10.2 6.8"/></g>
          </svg>
        </div>
      </div>

      <!-- Section rail -->
      <div class="rail" aria-hidden="true">
        <span>01</span>
        <i class="on"></i><i></i><i></i><i></i>
        <span>04</span>
      </div>

      <!-- Rotating scroll badge -->
      <a class="scroll" href="#projects" aria-label="Scroll down">
        <svg class="scroll-ring" viewBox="0 0 120 120" aria-hidden="true">
          <path id="scrollCircle" d="M60 60m-47 0a47 47 0 1 1 94 0a47 47 0 1 1-94 0" fill="none"/>
          <text><textPath href="#scrollCircle" textLength="290">SCROLL DOWN • HEXSSS • PORTFOLIO • </textPath></text>
        </svg>
        <svg class="scroll-core" viewBox="0 0 40 46" aria-hidden="true">
          <path class="sc-hex" d="M20 2 38 12.5v21L20 44 2 33.5v-21Z"/>
          <path class="sc-arrow" d="M20 15v15M14 24l6 6 6-6"/>
        </svg>
      </a>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
